<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentaFlix Assistant</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Marked.js para renderizar Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="app-container">
        <header class="header">
            <div class="logo">
                <h1>RentaFlix</h1>
            </div>
        </header>

        <main class="chat-container" id="chat-container">
            <div class="message assistant">
                <div class="avatar">RF</div>
                <div class="message-content">
                    <p>¡Hola! Soy tu asistente inteligente de RentaFlix. Puedo ayudarte a buscar películas, consultar el inventario, realizar alquileres o incluso recomendarte películas similares si no tenemos copias disponibles.</p>
                    <p>¿En qué te puedo ayudar hoy?</p>
                </div>
            </div>
        </main>

        <div class="typing-indicator hidden" id="typing-indicator">
            <div class="avatar">RF</div>
            <div class="dots">
                <span></span><span></span><span></span>
            </div>
            <div class="status-text" id="status-text">Procesando...</div>
        </div>

        <footer class="input-area">
            <div class="input-wrapper">
                <textarea 
                    id="message-input" 
                    placeholder="Pregunta por El Padrino, busca por director, etc..." 
                    rows="1"
                ></textarea>
                <button id="send-btn" class="send-btn" aria-label="Enviar mensaje">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
